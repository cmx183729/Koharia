name: Android Release Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y nasm

      - name: Create ephemeral release signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair \
            -keystore ci-release.keystore \
            -storepass changeit \
            -keypass changeit \
            -alias koharia-ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=Koharia CI, OU=Build, O=Koharia, L=CI, ST=CI, C=US" \
            -noprompt
          {
            printf 'storeFile=ci-release.keystore\n'
            printf 'storePassword=changeit\n'
            printf 'keyAlias=koharia-ci\n'
            printf 'keyPassword=changeit\n'
          } > keystore.properties

      - name: Build release APKs
        run: ./gradlew assembleRelease -Pinclude-telemetry -Penable-updater

      - name: Upload APK artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: koharia-release-apks-${{ github.sha }}
          if-no-files-found: error
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
